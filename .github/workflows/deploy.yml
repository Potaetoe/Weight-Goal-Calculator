name: Verify and deploy

# Publishes to GitHub Pages, but only after the Python suite passes, the
# generated fixture is confirmed current, and the browser core's
# self-test reports zero mismatches. A stale fixture would let the
# self-test report PASS while the two implementations actually disagree,
# which is the one failure this pipeline exists to prevent.
#
# ---------------------------------------------------------------------
# THE BUILD IS A COPY
#
# apps/web contains exactly what gets published - nothing more. The
# self-test, its 1.5 MB fixture, and the checks all live in dev/, which
# is a sibling directory the deploy never looks at.
#
# This used to be a strip step: publish web/ minus three files by name,
# minus any <!-- dev-only --> blocks, followed by guards that failed the
# build if a stripped file survived or a published page still linked to
# one. All of that was machinery for keeping product and tooling apart
# inside one directory. Two directories do it for free, and a deletion
# that never happens cannot go wrong.
#
# There is deliberately no staging branch and no preview deployment.
# Both were tried and removed: every path in this app is relative, so it
# behaves identically at any prefix, and http://localhost is a secure
# context, so the service worker registers and the install prompt fires
# there. Local verification covers everything except installing the PWA
# from a real iPhone.
#
# A push is therefore a release. What protects production is the verify
# job, not a staging step. Run tools/check.py before pushing.
# ---------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_equivalence.py replays the pre-refactor implementation
          # from commit 38817ce. With the default shallow clone that commit
          # is unreachable and the test SKIPS instead of running, so the
          # suite would go green without ever checking the refactor.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tkinter
        # apps/desktop/weight_calculator.py imports tkinter at module
        # scope. Importing it headless is fine - only instantiating Tk()
        # needs a display - but without the package
        # tests/test_formatting.py silently skips and the fixture loses
        # its formatted-output section.
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Confirm tkinter is importable
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Run the Python suite
        run: python -m unittest discover -s tests -t . -v

      - name: Check dev/fixture.js is current
        run: |
          cp dev/fixture.js /tmp/fixture.committed.js
          python tools/gen_web_fixture.py
          python - <<'PY'
          import json
          import pathlib
          import sys

          def load(path):
              text = pathlib.Path(path).read_text(encoding="utf-8")
              body = text.split("window.WEB_FIXTURE = ", 1)[1].rsplit(";", 1)[0]
              return json.loads(body)

          # Compared as re-serialized text rather than with ==, because the
          # fixture contains NaN and NaN != NaN would fail every run.
          committed = json.dumps(load("/tmp/fixture.committed.js"), sort_keys=True)
          regenerated = json.dumps(load("dev/fixture.js"), sort_keys=True)

          if committed != regenerated:
              print("::error file=dev/fixture.js::dev/fixture.js is out of date. "
                    "core/calc_core.py changed without the fixture being "
                    "regenerated, so the self-test would be checking "
                    "apps/web/calc_core.js against stale expectations. Run: "
                    "python tools/gen_web_fixture.py and commit the result.")
              sys.exit(1)

          print("fixture matches the current core/calc_core.py")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the browser core's self-test
        # The step above proves fixture.js still matches calc_core.py.
        # This one proves calc_core.js still matches fixture.js - the
        # other half, and the one that decides whether the page people
        # actually load computes the right answers. Without it nothing
        # in this pipeline ever executes a line of the JavaScript it
        # deploys. Same checks the browser page runs; see
        # tools/run_selftest.js.
        run: node tools/run_selftest.js

      - name: Check apps/web is publishable
        # Derived from the directory rather than a list somebody has to
        # remember to update: every file is in the service worker's
        # shell, and every local href/src resolves. See tools/check_web.py.
        run: python tools/check_web.py

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build the site
        # A copy. apps/web is the product, so there is nothing to strip
        # and nothing to guard against having failed to strip.
        run: |
          rm -rf _site
          cp -r apps/web _site
          echo "publishing ($(du -sh _site | cut -f1)):"
          ls -R _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

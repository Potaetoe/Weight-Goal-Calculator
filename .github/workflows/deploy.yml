name: Verify and deploy

# Publishes to GitHub Pages, but only after the Python suite passes, the
# generated fixture is confirmed current, and the browser core's
# self-test reports zero mismatches. A stale fixture would let the
# self-test report PASS while the two implementations actually disagree,
# which is the one failure this pipeline exists to prevent.
#
# ---------------------------------------------------------------------
# ONE BRANCH, TWO BUILDS
#
# Every push publishes two builds of the same commit:
#
#   /          the product, self-test stripped
#   /preview/  the same source untouched, self-test included, noindex
#
# The preview exists for the things localhost cannot do: installing the
# PWA from a real phone (a LAN address over plain http is not a secure
# context) and handing someone a link before it is the live site.
# Everything else about this app is testable locally - every path in it
# is relative, so it behaves the same at any prefix.
#
# This deliberately does NOT use a second branch. The two builds differ
# only at build time: the production build removes the self-test files
# and the <!-- dev-only --> blocks that link to them. A branch split
# bought nothing here except merge conflicts and the chance for a clean
# auto-merge to quietly falsify a comment. If work ever needs staging
# where someone else can see it before release, that is when to bring a
# second branch back.
# ---------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_equivalence.py replays the pre-refactor implementation
          # from commit 38817ce. With the default shallow clone that commit
          # is unreachable and the test SKIPS instead of running, so the
          # suite would go green without ever checking the refactor.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tkinter
        # weight_calculator.py imports tkinter at module scope. Importing it
        # headless is fine - only instantiating Tk() needs a display - but
        # without the package tests/test_formatting.py silently skips and
        # the fixture loses its formatted-output section.
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Confirm tkinter is importable
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Run the Python suite
        run: python -m unittest discover -s tests -t . -v

      - name: Check web/fixture.js is current
        run: |
          cp web/fixture.js /tmp/fixture.committed.js
          python tools/gen_web_fixture.py
          python - <<'PY'
          import json
          import pathlib
          import sys

          def load(path):
              text = pathlib.Path(path).read_text(encoding="utf-8")
              body = text.split("window.WEB_FIXTURE = ", 1)[1].rsplit(";", 1)[0]
              return json.loads(body)

          # Compared as re-serialized text rather than with ==, because the
          # fixture contains NaN and NaN != NaN would fail every run.
          committed = json.dumps(load("/tmp/fixture.committed.js"), sort_keys=True)
          regenerated = json.dumps(load("web/fixture.js"), sort_keys=True)

          if committed != regenerated:
              print("::error file=web/fixture.js::web/fixture.js is out of date. "
                    "calc_core.py changed without the fixture being regenerated, "
                    "so the deployed self-test would be checking web/calc_core.js "
                    "against stale expectations. Run: python tools/gen_web_fixture.py "
                    "and commit the result.")
              sys.exit(1)

          print("fixture matches the current calc_core.py")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the browser core's self-test
        # The step above proves fixture.js still matches calc_core.py.
        # This one proves calc_core.js still matches fixture.js - the
        # other half, and the one that decides whether the page people
        # actually load computes the right answers. Without it nothing
        # in this pipeline ever executes a line of the JavaScript it
        # deploys. Same checks the browser page runs; see
        # tools/run_selftest.js.
        run: node tools/run_selftest.js

      - name: Check the page's assets exist
        # Cheap guard against a rename breaking the deployed page: the
        # browser would just 404 the script and render a dead form.
        run: |
          test -f web/index.html
          test -f web/calc_core.js
          test -f web/selftest.html
          test -f web/selftest.js
          test -f web/manifest.json
          test -f web/sw.js
          test -f web/install.html
          test -f web/install.js
          test -f web/theme.js
          test -f web/icons/icon-192.png
          test -f web/icons/icon-512.png
          test -f web/icons/apple-touch-icon.png
          grep -q 'src="calc_core.js"' web/index.html
          grep -q 'rel="manifest"' web/index.html
          echo "web/ looks deployable"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build the production root
        # The self-test is developer tooling, not part of the product.
        # fixture.js alone is 1.5 MB against roughly 50 KB for the whole
        # app, so publishing it would multiply the site's weight ~30x to
        # serve a page no visitor has a reason to open.
        run: |
          rm -rf _site
          cp -r web _site
          rm -f _site/selftest.html _site/selftest.js _site/fixture.js
          # Drop the <!-- dev-only --> blocks, which link to the pages
          # that were just removed.
          find _site -name '*.html' -exec \
            sed -i '/<!-- dev-only:start/,/<!-- dev-only:end -->/d' {} +

          # Guards. A silent failure here either ships the 1.5 MB
          # fixture anyway or publishes a link that 404s.
          for f in selftest.html selftest.js fixture.js; do
            if [ -e "_site/$f" ]; then
              echo "::error::$f is still in the production build"
              exit 1
            fi
          done
          if grep -rn 'selftest\.html\|selftest\.js\|fixture\.js' \
               --include='*.html' --include='*.json' _site; then
            echo "::error::a production page still references the" \
                 "self-test, which is not published at the root"
            exit 1
          fi
          echo "production root ($(du -sh _site | cut -f1)):"
          ls _site

      - name: Build the preview
        # The same commit, published intact - self-test and all. The
        # point of the preview is to exercise on real HTTPS exactly what
        # the production build strips.
        run: |
          cp -r web _site/preview
          # Staging must not be indexed. <head> is its own line in every
          # page here, which the verify job's asset check keeps true.
          find _site/preview -name '*.html' -exec sed -i \
            's|^<head>$|<head>\n<meta name="robots" content="noindex">|' {} +

          # The preview is worthless if the harness didn't make it.
          for f in selftest.html selftest.js fixture.js index.html; do
            if [ ! -e "_site/preview/$f" ]; then
              echo "::error::preview is missing $f"
              exit 1
            fi
          done
          grep -q 'name="robots" content="noindex"' _site/preview/index.html
          echo "preview ($(du -sh _site/preview | cut -f1)):"
          ls _site/preview

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weight Goal Calculator - core self-test</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 14px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
    margin: 0; padding: 24px; background: #fff0f5; color: #5b4254;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; opacity: .75; }
  #summary { padding: 14px 16px; border-radius: 8px; font-weight: 700;
             margin-bottom: 18px; }
  .pass { background: #d8f0e4; color: #1d5b3f; }
  .fail { background: #fde2e2; color: #8a3b3b; }
  table { border-collapse: collapse; width: 100%; max-width: 900px; }
  th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid rgba(0,0,0,.1); }
  th { font-weight: 700; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .ok { color: #1d5b3f; }
  .bad { color: #8a3b3b; font-weight: 700; }
  pre { background: rgba(0,0,0,.05); padding: 12px; border-radius: 6px;
        overflow-x: auto; max-width: 900px; white-space: pre-wrap;
        word-break: break-word; }
  @media (prefers-color-scheme: dark) {
    body { background: #241b21; color: #f0dde7; }
    .pass { background: #1d3b2d; color: #a9e6c6; }
    .fail { background: #4a2626; color: #f3b0b0; }
    pre, th, td { border-color: rgba(255,255,255,.12); }
    pre { background: rgba(255,255,255,.06); }
    .ok { color: #a9e6c6; } .bad { color: #f3b0b0; }
  }
</style>
</head>
<body>
<h1>Core self-test</h1>
<p class="sub">
  Compares <code>calc_core.js</code> against <code>fixture.js</code>,
  which was generated from <code>calc_core.py</code>. Any mismatch is
  porting drift. The same checks run headlessly in CI
  (<code>tools/run_selftest.js</code>) and block the deploy.
</p>

<div id="summary">running…</div>
<div id="tables"></div>
<div id="details"></div>

<script>
// Load the core, the fixture, and the checks with a cache-buster.
// Without this the browser will happily serve a stale calc_core.js and
// report PASS against code it never ran - which is worse than no test
// at all. document.write keeps the three loads synchronous and ordered.
(function () {
  var t = Date.now();
  document.write('<script src="calc_core.js?t=' + t + '"><\/script>');
  document.write('<script src="fixture.js?t=' + t + '"><\/script>');
  document.write('<script src="selftest.js?t=' + t + '"><\/script>');
})();
</script>
<script>
(function () {
  "use strict";
  // The checks themselves live in selftest.js, shared with the headless
  // CI runner. This block only renders what they report.
  var result = window.WeightCalcSelfTest.runSelfTest(
    window.WeightCalcCore, window.WEB_FIXTURE
  );
  var groups = result.groups;
  var failures = result.failures;
  var total = result.total, fail = result.fail;

  var sum = document.getElementById("summary");
  sum.className = fail === 0 ? "pass" : "fail";
  sum.textContent = fail === 0
    ? "PASS - " + total.toLocaleString() + " checks, 0 mismatches ("
      + result.planCases.toLocaleString() + " plan cases)"
    : "FAIL - " + fail.toLocaleString() + " of " + total.toLocaleString()
      + " checks mismatched";

  var rows = groups.map(function (x) {
    return "<tr><td>" + x.label + "</td><td class='n'>" +
      x.total.toLocaleString() + "</td><td class='n " +
      (x.fail ? "bad" : "ok") + "'>" + x.fail.toLocaleString() + "</td></tr>";
  }).join("");
  document.getElementById("tables").innerHTML =
    "<table><tr><th>group</th><th class='n'>checks</th>" +
    "<th class='n'>mismatches</th></tr>" + rows + "</table>";

  if (failures.length) {
    document.getElementById("details").innerHTML =
      "<h1 style='margin-top:24px'>First " + failures.length +
      " mismatches</h1><pre>" +
      failures.map(function (f) {
        return f.group + " :: " + f.name +
          "\n  expected: " + JSON.stringify(f.expected) +
          "\n  actual  : " + JSON.stringify(f.actual) +
          (f.ctx ? "\n  input   : " + JSON.stringify(f.ctx) : "");
      }).join("\n\n").replace(/[<>&]/g, function (ch) {
        return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[ch];
      }) + "</pre>";
  }

  window.__SELFTEST__ = result;
})();
</script>
</body>
</html>
